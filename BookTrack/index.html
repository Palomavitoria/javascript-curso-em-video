<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BookTrack</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ==============================
         CABEÇALHO
         ============================== -->

    <header>

        <h1>📚 BookTrack</h1>

        <p>Organize sua biblioteca pessoal.</p>

    </header>


    <main>

        <!-- ==============================
             CADASTRO DE LIVROS
             ============================== -->

        <section id="cadastro">

            <h2 id="tituloFormulario">Adicionar Livro</h2>

            <form>

                <label for="titulo">Título</label>

                <input
                    type="text"
                    id="titulo"
                    placeholder="Digite o título do livro"
                >


                <label for="autor">Autor</label>

                <input
                    type="text"
                    id="autor"
                    placeholder="Digite o nome do autor"
                >


                <label for="genero">Gênero</label>

                <input
                    type="text"
                    id="genero"
                    placeholder="Ex.: Romance, Ficção..."
                >


                <label for="paginas">Número de páginas</label>

                <input
                    type="number"
                    id="paginas"
                    placeholder="Ex.: 320"
                    min="1"
                >


                <label for="status">Status</label>

                <select id="status">

                    <option value="quero-ler">
                        Quero ler
                    </option>

                    <option value="lendo">
                        Lendo
                    </option>

                    <option value="lido">
                        Lido
                    </option>

                </select>


                <div class="botoes-formulario">

                    <button type="button" id="btnAdicionar">
                        Adicionar Livro
                    </button>

                    <button
                        type="button"
                        id="btnCancelar"
                        class="btn-cancelar"
                        hidden
                    >
                        Cancelar
                    </button>

                </div>

            </form>

        </section>


        <!-- ==============================
             BIBLIOTECA
             ============================== -->

        <section id="biblioteca">

            <div class="cabecalho-biblioteca">

                <h2>Minha Biblioteca</h2>

                <input
                    type="text"
                    id="busca"
                    placeholder="🔎 Buscar livro..."
                >

            </div>


            <div id="listaLivros">

                <p class="mensagem-vazia">
                    Nenhum livro cadastrado.
                </p>

            </div>

        </section>


        <!-- ==============================
             ESTATÍSTICAS
             ============================== -->

        <section id="estatisticas">

            <h2>📊 Estatísticas</h2>

            <div id="dados">

                <div class="estatistica">
                    <span>📚</span>
                    <p>Total de livros</p>
                    <strong id="totalLivros">0</strong>
                </div>


                <div class="estatistica">
                    <span>✅</span>
                    <p>Livros lidos</p>
                    <strong id="livrosLidos">0</strong>
                </div>


                <div class="estatistica">
                    <span>📖</span>
                    <p>Lendo</p>
                    <strong id="livrosLendo">0</strong>
                </div>


                <div class="estatistica">
                    <span>📚</span>
                    <p>Quero ler</p>
                    <strong id="livrosQueroLer">0</strong>
                </div>


                <div class="estatistica">
                    <span>📄</span>
                    <p>Total de páginas</p>
                    <strong id="totalPaginas">0</strong>
                </div>

            </div>

        </section>

    </main>


    <!-- ==============================
         RODAPÉ
         ============================== -->

    <footer>

        <p>
            Projeto Final do Curso de JavaScript • Curso em Vídeo
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
